<!-- Espaço reservado para a mensagem de erro, evitando deslocamento do formulário -->
<div class="mb-2 min-h-9">
  @if (message()) {
    <div
      role="alert"
      class="flex min-h-9 items-center gap-2.5 rounded-md bg-brand/5 px-3 py-2 text-brand"
    >
      <svg
        class="h-[18px] w-[18px] shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        ></path>
      </svg>
      <span class="text-[14px] font-medium leading-snug">{{ message() }}</span>
    </div>
  }
</div>
