<div class="flex min-h-screen w-full flex-col bg-paper-soft font-body">
  @if (isLoading()) {
    <div class="flex flex-1 items-center justify-center p-12 text-[14px] text-ink-soft">
      Carregando painel...
    </div>
  } @else if (errorMessage()) {
    <div class="flex-1 flex flex-col items-center justify-center px-4 text-center">
      <div class="h-16 w-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4">
        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <h3 class="text-xl font-brand text-ink mb-2">Ops, algo correu mal</h3>
      <p class="text-ink-soft mb-6 max-w-md">{{ errorMessage() }}</p>
      <button (click)="tentarNovamente()" class="bg-brand text-white px-6 py-2 rounded-sm hover:bg-brand-dark transition-colors">
        Tentar Novamente
      </button>
    </div>
  } @else if (adminData(); as data) {
    <app-admin-header [abaAtiva]="abaAtiva()" (abaChange)="mudarAba($event)"></app-admin-header>

    <main class="content-container w-full flex-1 px-5 py-8 md:px-8 md:py-12">
      @switch (abaAtiva()) {
        @case ('visao-geral') {
          <app-admin-dashboard [revendedoras]="data.revendedoras"></app-admin-dashboard>
        }
        @case ('revendedoras') {
          <app-admin-revendedoras [revendedoras]="data.revendedoras"></app-admin-revendedoras>
        }
        @case ('estoque') {
          <app-admin-estoque [estoque]="data.estoque"></app-admin-estoque>
        }
        @case ('maletas') {
          <app-admin-maletas
            [processamentos]="data.processamentos"
            [revendedoras]="data.revendedoras"
          ></app-admin-maletas>
        }
      }
    </main>
  }
</div>
