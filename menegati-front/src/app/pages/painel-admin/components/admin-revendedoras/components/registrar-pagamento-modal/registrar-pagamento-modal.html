<div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4" (click)="cancelar()">
  <div
    class="w-full max-w-md rounded-sm border border-line bg-paper shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-line px-6 py-5">
      <div>
        <h3 class="font-brand text-xl text-ink">Registrar Pagamento</h3>
        <p class="mt-0.5 text-[13px] text-ink-soft">{{ nomeRevendedora() }}</p>
      </div>
      <button
        type="button"
        (click)="cancelar()"
        class="flex h-8 w-8 items-center justify-center rounded-full text-ink-soft transition-colors hover:bg-paper-soft hover:text-ink"
        aria-label="Fechar"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="px-6 py-5">
      <div class="mb-5 rounded-sm border border-line bg-paper-soft px-4 py-3 text-[13px]">
        <span class="text-ink-soft">Saldo devedor atual: </span>
        <span class="font-semibold text-ink">{{ saldoDevedor() | currency: 'BRL' }}</span>
      </div>

      <form class="flex flex-col gap-4" (ngSubmit)="confirmar()">
        <div>
          <label class="mb-1.5 block text-[12px] font-semibold tracking-wide text-ink-soft uppercase">Valor Pago</label>
          <div class="flex h-10 items-center gap-1.5 rounded-sm border border-line bg-white px-3 focus-within:border-brand">
            <span class="text-[13px] text-ink-soft">R$</span>
            <input
              type="number"
              min="0"
              step="0.01"
              placeholder="0,00"
              class="w-full border-none bg-transparent p-0 text-[14px] text-ink outline-none"
              [ngModel]="valor()"
              (ngModelChange)="valor.set($event)"
              name="valor"
              required
            />
          </div>
        </div>

        <div>
          <label class="mb-1.5 block text-[12px] font-semibold tracking-wide text-ink-soft uppercase">Data do Pagamento</label>
          <input
            type="date"
            class="h-10 w-full rounded-sm border border-line bg-white px-3 text-[14px] text-ink focus:border-brand focus:outline-none"
            [ngModel]="data()"
            (ngModelChange)="data.set($event)"
            name="data"
            required
          />
        </div>

        <div>
          <label class="mb-1.5 block text-[12px] font-semibold tracking-wide text-ink-soft uppercase">Forma de Pagamento</label>
          <select
            class="h-10 w-full rounded-sm border border-line bg-white px-3 text-[14px] text-ink focus:border-brand focus:outline-none"
            [ngModel]="forma()"
            (ngModelChange)="forma.set($event)"
            name="forma"
          >
            <option value="DINHEIRO">Dinheiro</option>
            <option value="PIX">Pix</option>
            <option value="CARTAO">Cartão</option>
            <option value="TRANSFERENCIA">Transferência</option>
          </select>
        </div>

        <div>
          <label class="mb-1.5 block text-[12px] font-semibold tracking-wide text-ink-soft uppercase">Observação</label>
          <textarea
            rows="2"
            placeholder="Opcional"
            class="w-full resize-none rounded-sm border border-line bg-white px-3 py-2 text-[14px] text-ink focus:border-brand focus:outline-none"
            [ngModel]="observacao()"
            (ngModelChange)="observacao.set($event)"
            name="observacao"
          ></textarea>
        </div>

        <div class="mt-2 flex justify-end gap-3">
          <button
            type="button"
            (click)="cancelar()"
            class="rounded-sm border border-line px-5 py-2.5 text-[13px] font-medium text-ink-soft transition-colors hover:bg-paper-soft"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="rounded-sm bg-brand px-6 py-2.5 text-[13px] font-medium tracking-wide text-white shadow-sm transition-colors hover:bg-brand-dark"
          >
            Confirmar Pagamento
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
