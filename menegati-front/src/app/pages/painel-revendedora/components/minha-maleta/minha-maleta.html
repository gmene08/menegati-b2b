<div class="mb-8">
  <h2 class="font-brand text-3xl text-ink">A Minha Maleta</h2>
  <p class="mt-1 text-[14px] text-ink-soft">
    Marque as peças que já vendeu. Isto é só uma organização visual — o acerto final continua sendo
    feito pessoalmente com a loja.
  </p>
</div>

<app-tabela
  chaveLinha="id"
  [linhas]="itens()"
  [colunas]="colunas"
  [filtros]="filtros"
  titulo="Itens Consignados"
>
  <ng-template appCelula="status" let-item>
    <span
      class="inline-flex items-center rounded-full px-2 py-1 text-[10px] font-bold tracking-wide"
      [class]="badgeClasse(item.status)"
    >
      {{ statusRotulo(item.status) }}
    </span>
  </ng-template>

  <ng-template appCelula="acao" let-item>
    @if (item.status === 'ENCARREGADO') {
      <button
        type="button"
        (click)="marcarComoVendido(item.id)"
        class="w-full rounded-sm border border-brand px-3 py-1.5 text-[12px] font-medium text-brand transition-colors hover:bg-brand hover:text-white"
      >
        Marcar Venda
      </button>
    } @else if (item.status === 'MARC_VENDIDO_REV') {
      <button
        type="button"
        (click)="desmarcarComoVendido(item.id)"
        class="flex w-full items-center justify-center gap-1 rounded-sm border border-line bg-paper-soft px-3 py-1.5 text-[12px] font-medium text-ink-soft transition-colors hover:border-red-200 hover:bg-red-50 hover:text-red-600"
      >
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
        Desmarcar
      </button>
    } @else {
      <span class="text-[12px] text-ink-soft">—</span>
    }
  </ng-template>
</app-tabela>
