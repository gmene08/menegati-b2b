<div class="flex min-h-screen w-full bg-paper">
  <!-- Lado Esquerdo: Imagem da Marca (Separado no Componente login-image) -->
  <div class="hidden relative w-1/2 overflow-hidden bg-ink lg:block">
    <app-login-img></app-login-img>
  </div>

  <!-- Lado Direito: Formulário de Login (Separado no Componente login-form) -->
  <div class="relative flex w-full flex-col justify-center px-6 py-12 lg:w-1/2 lg:px-20 xl:px-32">
    <app-voltar-button></app-voltar-button>
    <div
      class="mx-auto w-full max-w-[440px] rounded-xl border border-line/70 bg-white/95 px-6 py-8 font-body shadow-[0_24px_70px_-42px_rgba(31,23,38,0.45)] sm:px-9 sm:py-10"
    >
      @if (!esqueceuSenha()) {
        <app-login-form
          [errorMessage]="loginErrorMsg()"
          (onLogin)="login($event)"
          (onEsqueceuSenha)="esqueceuSenhaToggle()"
        ></app-login-form>
      } @else {
        <app-recuperar-senha-form
          [isLoading] = "isLoadingRecuperar()"
          [message]="recuperarSenhaMsg()"
          [errorMessage]="recuperarSenhaErrorMsg()"
          (onRecuperarSenha)="recuperarSenha($event)"
          (onVoltarParaLogin)="esqueceuSenhaToggle()"
        ></app-recuperar-senha-form>
      }
      <app-convite-revendedora></app-convite-revendedora>
    </div>
  </div>
</div>
